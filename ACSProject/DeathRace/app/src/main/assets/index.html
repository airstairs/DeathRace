<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tron Light Cycles - Spectator Camera Switching</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            touch-action: none;
        }
        #minimap {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 150px;
            height: 150px;
            background: rgba(0, 10, 30, 0.8);
            border: 2px solid #0ff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
            z-index: 10;
            pointer-events: none;
        }
        #gameover {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            display: none;
            z-index: 20;
            text-shadow: 0 0 20px #f00;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border: 2px solid #f00;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
        }
        .btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        #gameover button {
            padding: 12px 24px;
            font-size: 18px;
            background: #0ff;
            border: none;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 10px #0ff;
            border-radius: 5px;
        }
        #gameover button.secondary {
            background: #444;
            color: #fff;
            box-shadow: 0 0 10px #444;
        }
        #spectate-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            display: none;
            z-index: 10;
            flex-direction: column;
            gap: 10px;
        }
        .spec-btn {
            padding: 10px 18px;
            background: rgba(0, 255, 255, 0.3);
            border: 2px solid #0ff;
            color: #0ff;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,255,255,0.5);
            text-transform: uppercase;
        }
        .spec-btn:active {
            background: rgba(0, 255, 255, 0.7);
        }
        .controls-container {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 10;
            pointer-events: none;
        }
        .control-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
            align-items: center;
        }
        .btn {
            width: 70px;
            height: 70px;
            background: rgba(0, 255, 255, 0.2);
            border: 2px solid #0ff;
            border-radius: 50%;
            color: #0ff;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            box-shadow: 0 0 10px rgba(0,255,255,0.5);
            position: relative;
        }
        .btn:active {
            background: rgba(0, 255, 255, 0.6);
        }
        #btn-gas { border-color: #0f0; color: #0f0; background: rgba(0, 255, 0, 0.2); }
        #btn-break { border-color: #f00; color: #f00; background: rgba(255, 0, 0, 0.2); }
        #btn-jump { 
            border-color: #ff0; 
            color: #ff0; 
            background: rgba(255, 255, 0, 0.2); 
            overflow: hidden;
        }
        #btn-nos { 
            border-color: #f0f; 
            color: #f0f; 
            background: rgba(255, 0, 255, 0.2); 
            overflow: hidden;
        }
        .overlay-badge {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
        }
        #jump-overlay { color: #ff0; }
        #nos-overlay { color: #f0f; }
    </style>
</head>
<body>
    <canvas id="minimap" width="150" height="150"></canvas>
    
    <div id="spectate-hud">
        <button class="spec-btn" onclick="switchCameraTarget()">SWITCH CAM</button>
    </div>

    <div id="gameover">
        <div id="gameover-text">GAME OVER</div>
        <div class="btn-container">
            <button onclick="restartGame()">PLAY AGAIN</button>
            <button class="secondary" id="watch-btn" onclick="spectateGame()">WATCH</button>
        </div>
    </div>

    <div class="controls-container">
        <div class="control-group">
            <div class="btn" id="btn-left">&#8592;</div>
            <div class="btn" id="btn-right">&#8594;</div>
        </div>
        <div class="control-group">
            <div class="btn" id="btn-break">B</div>
            <div class="btn" id="btn-nos">NOS<div id="nos-overlay" class="overlay-badge">6s</div></div>
            <div class="btn" id="btn-jump">J<div id="jump-overlay" class="overlay-badge">3s</div></div>
            <div class="btn" id="btn-gas">G</div>
        </div>
    </div>

    <!-- Three.js Library -->
    <script src="three.min.js"></script>
    <script>
        const MAP_SIZE = 800;
        let scene, camera, renderer;
        let bikes = [];
        let player;
        let staticBoxes = [];
        let dynamicBoxes = [];
        let gameActive = true;
        let isSpectating = false;
        let specTargetIndex = 0;
        let respawnGraceTimer = 0;
        let minimapCtx;
        let soccerBall;

        const GAME_STATE = {
            SPEED_NORMAL: 1.3,
            SPEED_FAST: 2.2,
            SPEED_SLOW: 0.6,
            SPEED_NOS: 3.5
        };

        class SoccerBall {
            constructor() {
                const radius = 6;
                const geom = new THREE.SphereGeometry(radius, 16, 16);
                const mat = new THREE.MeshBasicMaterial({ color: 0xff3300, wireframe: true });
                this.mesh = new THREE.Mesh(geom, mat);
                this.radius = radius;
                scene.add(this.mesh);
                this.reset();
            }

            reset() {
                const rx = (Math.random() - 0.5) * 400;
                const rz = (Math.random() - 0.5) * 400;
                this.mesh.position.set(rx, 150, rz);
                this.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 3,
                    -1,
                    (Math.random() - 0.5) * 3
                );
            }

            update() {
                this.velocity.y -= 0.15;
                this.mesh.position.add(this.velocity);

                if (this.mesh.position.y <= this.radius) {
                    this.mesh.position.y = this.radius;
                    this.velocity.y = -this.velocity.y * 0.75;
                    this.velocity.x *= 0.98;
                    this.velocity.z *= 0.98;
                }

                const halfLimit = MAP_SIZE / 2 - 25;
                if (Math.abs(this.mesh.position.x) > halfLimit) {
                    this.mesh.position.x = Math.sign(this.mesh.position.x) * halfLimit;
                    this.velocity.x = -this.velocity.x * 0.8;
                }
                if (Math.abs(this.mesh.position.z) > halfLimit) {
                    this.mesh.position.z = Math.sign(this.mesh.position.z) * halfLimit;
                    this.velocity.z = -this.velocity.z * 0.8;
                }

                this.mesh.rotation.x += 0.02;
                this.mesh.rotation.y += 0.03;

                const ballPos = this.mesh.position;
                bikes.forEach(b => {
                    if (!b.alive) return;
                    const bikePos = b.mesh.position;
                    const dist = ballPos.distanceTo(bikePos);
                    
                    if (dist < this.radius + 1.5) {
                        const pushDir = new THREE.Vector3().subVectors(ballPos, bikePos).normalize();
                        const impactForce = (b.speed || 1.5) * 4;
                        this.velocity.x = pushDir.x * impactForce + (Math.sin(b.angle) * 2);
                        this.velocity.z = pushDir.z * impactForce + (Math.cos(b.angle) * 2);
                        this.velocity.y += 3.5;
                    }
                });
            }
        }

        class Bike {
            constructor(color, isAI = false, name = "Player") {
                this.color = color;
                this.isAI = isAI;
                this.name = name;
                this.alive = true;
                this.mesh = new THREE.Group();
                
                const geom = new THREE.BoxGeometry(1.2, 0.6, 2.5);
                const mat = new THREE.MeshBasicMaterial({ color: color });
                this.body = new THREE.Mesh(geom, mat);
                this.mesh.add(this.body);

                this.trailGroup = new THREE.Group();
                scene.add(this.trailGroup);

                this.isJumping = false;
                this.jumpProgress = 0;
                this.jumpCooldown = 0;

                this.nosTimer = 0;
                this.nosUsed = false;

                if (this.isAI) {
                    const profiles = ['aggressive', 'defensive', 'erratic'];
                    this.personality = profiles[Math.floor(Math.random() * profiles.length)];
                } else {
                    this.personality = 'player';
                }

                this.reset(0, 0, 0);
            }

            reset(x, z, angle) {
                this.alive = true;
                this.mesh.visible = true;
                this.mesh.position.set(x, 0.4, z);
                this.angle = angle;
                this.speed = GAME_STATE.SPEED_NORMAL;
                this.turning = 0;
                this.mesh.rotation.y = this.angle;
                this.isJumping = false;
                this.jumpProgress = 0;
                this.jumpCooldown = 0;
                this.nosTimer = 0;
                this.nosUsed = false;

                if (!this.isAI) {
                    const nosOverlay = document.getElementById('nos-overlay');
                    if (nosOverlay) nosOverlay.style.display = 'none';
                }
                
                while(this.trailGroup.children.length > 0){ 
                    this.trailGroup.remove(this.trailGroup.children[0]); 
                }
                this.lastPoint = this.mesh.position.clone();
            }

            destroy() {
                this.alive = false;
                this.mesh.visible = false;
                this.speed = 0;
                this.turning = 0;
                dynamicBoxes = dynamicBoxes.filter(box => box.owner !== this);
                for (let i = this.trailGroup.children.length - 1; i >= 0; i--) {
                    this.trailGroup.remove(this.trailGroup.children[i]);
                }
            }

            jump() {
                if (!this.alive || this.jumpCooldown > 0 || this.isJumping || !gameActive) return false;
                this.isJumping = true;
                this.jumpProgress = 0;
                this.jumpCooldown = 180;
                return true;
            }

            triggerNOS() {
                if (!this.alive || this.nosUsed || !gameActive) return false;
                this.nosUsed = true;
                this.nosTimer = 360; 
                return true;
            }

            update() {
                if (!gameActive || !this.alive) return;

                if (this.jumpCooldown > 0) {
                    this.jumpCooldown--;
                    if (!this.isAI) {
                        const overlay = document.getElementById('jump-overlay');
                        const secs = (this.jumpCooldown / 60).toFixed(1);
                        if (this.jumpCooldown > 0) {
                            overlay.style.display = 'flex';
                            overlay.innerText = secs + 's';
                        } else {
                            overlay.style.display = 'none';
                        }
                    }
                }

                if (this.nosTimer > 0) {
                    this.nosTimer--;
                    if (!this.isAI) {
                        const overlay = document.getElementById('nos-overlay');
                        const secs = (this.nosTimer / 60).toFixed(1);
                        if (this.nosTimer > 0) {
                            overlay.style.display = 'flex';
                            overlay.innerText = secs + 's';
                        } else {
                            overlay.style.display = 'none';
                            overlay.innerText = 'USED';
                        }
                    }
                }

                if (this.isJumping) {
                    this.jumpProgress += 0.04;
                    if (this.jumpProgress >= 1) {
                        this.isJumping = false;
                        this.mesh.position.y = 0.4;
                    } else {
                        this.mesh.position.y = 0.4 + Math.sin(this.jumpProgress * Math.PI) * 14;
                    }
                }

                this.angle += this.turning * 0.038;
                this.mesh.rotation.y = this.angle;

                let currentSpeed = this.speed;
                if (this.nosTimer > 0) currentSpeed = GAME_STATE.SPEED_NOS;

                const dx = Math.sin(this.angle) * currentSpeed;
                const dz = Math.cos(this.angle) * currentSpeed;
                this.mesh.position.x += dx;
                this.mesh.position.z += dz;

                if (this.mesh.position.distanceTo(this.lastPoint) > 4) {
                    this.createTrailSegment(this.lastPoint, this.mesh.position.clone(), this.mesh.position.y);
                    this.lastPoint = this.mesh.position.clone();
                }
            }

            createTrailSegment(p1, p2, currentY) {
                const dist = p1.distanceTo(p2);
                if (dist < 0.1) return;
                const geom = new THREE.BoxGeometry(0.3, 1.2, dist);
                const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
                const segment = new THREE.Mesh(geom, mat);
                
                segment.position.copy(p1).add(p2).multiplyScalar(0.5);
                segment.position.y = Math.max(0.6, currentY);
                segment.lookAt(p2);
                
                this.trailGroup.add(segment);
                
                segment.geometry.computeBoundingBox();
                const box = new THREE.Box3();
                box.copy(segment.geometry.boundingBox).applyMatrix4(segment.matrixWorld);
                
                dynamicBoxes.push({
                    mesh: segment,
                    box: box,
                    owner: this,
                    createdTime: Date.now(),
                    solidColor: this.color
                });
            }
        }

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x02021a, 0.0025);

            camera = new THREE.PerspectiveCamera(95, window.innerWidth / window.innerHeight, 0.1, 2000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            minimapCtx = document.getElementById('minimap').getContext('2d');

            createArena();

            player = new Bike(0x00ffff, false, "Player");
            const ai1 = new Bike(0xff5500, true, "AI 1");
            const ai2 = new Bike(0xff00ff, true, "AI 2");
            const ai3 = new Bike(0xffff00, true, "AI 3");

            bikes = [player, ai1, ai2, ai3];
            bikes.forEach(b => scene.add(b.mesh));

            soccerBall = new SoccerBall();

            resetPositions();
            setupControls();
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function createArena() {
            const gridHelper = new THREE.GridHelper(MAP_SIZE, 80, 0x00ffff, 0x222266);
            gridHelper.position.y = 0;
            scene.add(gridHelper);

            const wallMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });
            const half = MAP_SIZE / 2;
            const thickness = 2;
            const height = 15;

            const createBoundary = (x, z, w, d) => {
                const geom = new THREE.BoxGeometry(w, height, d);
                const mesh = new THREE.Mesh(geom, wallMat);
                mesh.position.set(x, height / 2, z);
                mesh.updateMatrixWorld(true);
                scene.add(mesh);
                
                mesh.geometry.computeBoundingBox();
                const box = new THREE.Box3();
                box.copy(mesh.geometry.boundingBox).applyMatrix4(mesh.matrixWorld);
                staticBoxes.push(box);
            };

            createBoundary(0, -half, MAP_SIZE, thickness);
            createBoundary(0, half, MAP_SIZE, thickness);
            createBoundary(-half, 0, thickness, MAP_SIZE);
            createBoundary(half, 0, thickness, MAP_SIZE);
        }

        function resetPositions() {
            dynamicBoxes = [];
            player.reset(-150, -150, Math.PI * 0.75);
            bikes[1].reset(150, -150, Math.PI * 1.25);
            bikes[2].reset(-150, 150, Math.PI * 0.25);
            bikes[3].reset(150, 150, Math.PI * 1.75);

            bikes.forEach(b => {
                if (b.isAI) {
                    const profiles = ['aggressive', 'defensive', 'erratic'];
                    b.personality = profiles[Math.floor(Math.random() * profiles.length)];
                }
            });

            if (soccerBall) soccerBall.reset();
            respawnGraceTimer = 50; 
            isSpectating = false;
            document.getElementById('spectate-hud').style.display = 'none';
        }

        function setupControls() {
            window.addEventListener('keydown', (e) => {
                if (!player.alive && isSpectating && (e.key === ' ' || e.key === 'j' || e.key === 'J')) {
                    switchCameraTarget();
                    return;
                }
                if (!player.alive) return;
                if (e.key === 'ArrowLeft' || e.key === 'a') player.turning = 1;
                if (e.key === 'ArrowRight' || e.key === 'd') player.turning = -1;
                if (e.key === 'ArrowUp' || e.key === 'w') player.speed = GAME_STATE.SPEED_FAST;
                if (e.key === 'ArrowDown' || e.key === 's') player.speed = GAME_STATE.SPEED_SLOW;
                if (e.key === ' ' || e.key === 'j') player.jump();
                if (e.key === 'Shift' || e.key === 'n' || e.key === 'N') player.triggerNOS();
            });

            window.addEventListener('keyup', (e) => {
                if (!player.alive) return;
                if ((e.key === 'ArrowLeft' || e.key === 'a') && player.turning === 1) player.turning = 0;
                if ((e.key === 'ArrowRight' || e.key === 'd') && player.turning === -1) player.turning = 0;
                if ((e.key === 'ArrowUp' || e.key === 'w') || (e.key === 'ArrowDown' || e.key === 's')) {
                    player.speed = GAME_STATE.SPEED_NORMAL;
                }
            });

            const bindTouch = (id, onDown, onUp) => {
                const el = document.getElementById(id);
                if (!el) return;
                el.addEventListener('touchstart', (e) => { e.preventDefault(); if(player.alive) onDown(); });
                el.addEventListener('touchend', (e) => { e.preventDefault(); if(player.alive) onUp(); });
                el.addEventListener('mousedown', () => { if(player.alive) onDown(); });
                el.addEventListener('mouseup', () => { if(player.alive) onUp(); });
            };

            bindTouch('btn-left', () => player.turning = 1, () => { if(player.turning === 1) player.turning = 0; });
            bindTouch('btn-right', () => player.turning = -1, () => { if(player.turning === -1) player.turning = 0; });
            bindTouch('btn-gas', () => player.speed = GAME_STATE.SPEED_FAST, () => player.speed = GAME_STATE.SPEED_NORMAL);
            bindTouch('btn-break', () => player.speed = GAME_STATE.SPEED_SLOW, () => player.speed = GAME_STATE.SPEED_NORMAL);
            
            const jumpBtn = document.getElementById('btn-jump');
            jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if(player.alive) player.jump(); });
            jumpBtn.addEventListener('mousedown', () => { if(player.alive) player.jump(); });

            const nosBtn = document.getElementById('btn-nos');
            nosBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if(player.alive) player.triggerNOS(); });
            nosBtn.addEventListener('mousedown', () => { if(player.alive) player.triggerNOS(); });
        }

        function updateAI(ai) {
            if (!ai.alive) return;
            ai.turning = 0;

            if (ai.personality === 'defensive') {
                ai.speed = GAME_STATE.SPEED_SLOW * 1.1;
            } else if (ai.personality === 'aggressive') {
                ai.speed = GAME_STATE.SPEED_FAST * 0.95;
            } else {
                ai.speed = GAME_STATE.SPEED_NORMAL;
            }

            const lookAheadDist = ai.personality === 'aggressive' ? 70 : 55;
            const halfMap = MAP_SIZE / 2 - 30;
            const now = Date.now();

            const isBlocked = (x, z) => {
                if (Math.abs(x) > halfMap || Math.abs(z) > halfMap) return true;
                const testVec = new THREE.Vector3(x, 0.4, z);
                for (let item of dynamicBoxes) {
                    if (ai.isJumping) continue;
                    if (now - item.createdTime < 600) continue;
                    if (item.box.containsPoint(testVec)) return true;
                }
                return false;
            };

            const cX = ai.mesh.position.x + Math.sin(ai.angle) * lookAheadDist;
            const cZ = ai.mesh.position.z + Math.cos(ai.angle) * lookAheadDist;

            const leftAngle = ai.angle - 0.7;
            const lX = ai.mesh.position.x + Math.sin(leftAngle) * (lookAheadDist * 0.75);
            const lZ = ai.mesh.position.z + Math.cos(leftAngle) * (lookAheadDist * 0.75);

            const rightAngle = ai.angle + 0.7;
            const rX = ai.mesh.position.x + Math.sin(rightAngle) * (lookAheadDist * 0.75);
            const rZ = ai.mesh.position.z + Math.cos(rightAngle) * (lookAheadDist * 0.75);

            const centerBlocked = isBlocked(cX, cZ);
            const leftBlocked = isBlocked(lX, lZ);
            const rightBlocked = isBlocked(rX, rZ);

            if (centerBlocked || leftBlocked || rightBlocked) {
                if (ai.personality === 'defensive' && Math.random() < 0.3) {
                    ai.speed = GAME_STATE.SPEED_SLOW;
                }

                if (!leftBlocked && rightBlocked) {
                    ai.turning = 1; 
                } else if (!rightBlocked && leftBlocked) {
                    ai.turning = -1; 
                } else {
                    ai.turning = (ai.mesh.position.x > 0) ? 1 : -1;
                }
                
                if (ai.jumpCooldown === 0 && Math.random() < 0.5) {
                    ai.jump();
                }
            } else {
                if (ai.personality === 'aggressive' && player.alive) {
                    const targetAngle = Math.atan2(player.mesh.position.x - ai.mesh.position.x, player.mesh.position.z - ai.mesh.position.z);
                    let angleDiff = targetAngle - ai.angle;
                    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                    ai.turning = Math.abs(angleDiff) > 0.1 ? (angleDiff > 0 ? 0.8 : -0.8) : 0;
                } else if (ai.personality === 'defensive') {
                    const distToEdgeX = halfMap - Math.abs(ai.mesh.position.x);
                    const distToEdgeZ = halfMap - Math.abs(ai.mesh.position.z);
                    if (distToEdgeX < 120 || distToEdgeZ < 120) {
                        const targetAngle = Math.atan2(-ai.mesh.position.x, -ai.mesh.position.z);
                        let angleDiff = targetAngle - ai.angle;
                        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                        ai.turning = angleDiff > 0 ? 0.8 : -0.8;
                    }
                } else {
                    if (Math.random() < 0.05) {
                        ai.targetTurnDir = (Math.random() - 0.5) * 1.2;
                    }
                    ai.turning = ai.targetTurnDir || 0;
                }
            }
        }

        function checkCollisions() {
            if (respawnGraceTimer > 0) {
                respawnGraceTimer--;
                return;
            }

            const now = Date.now();

            for (let i = 0; i < bikes.length; i++) {
                let b1 = bikes[i];
                if (!b1.alive) continue;

                b1.body.geometry.computeBoundingBox();
                const b1Box = new THREE.Box3();
                b1Box.copy(b1.body.geometry.boundingBox).applyMatrix4(b1.body.matrixWorld);

                for (let box of staticBoxes) {
                    if (b1Box.intersectsBox(box)) {
                        b1.destroy();
                        checkMatchStatus();
                        break;
                    }
                }

                if (!b1.alive) continue;

                for (let item of dynamicBoxes) {
                    const age = now - item.createdTime;

                    if (age >= 800 && item.mesh.material.color.getHex() === 0xffffff) {
                        item.mesh.material.color.setHex(item.solidColor);
                    }

                    if (age < 800) continue;

                    if (!b1.isJumping && b1Box.intersectsBox(item.box)) {
                        b1.destroy();
                        checkMatchStatus();
                        break;
                    }
                }

                if (!b1.alive) continue;

                for (let j = i + 1; j < bikes.length; j++) {
                    let b2 = bikes[j];
                    if (!b2.alive) continue;

                    b2.body.geometry.computeBoundingBox();
                    const b2Box = new THREE.Box3();
                    b2Box.copy(b2.body.geometry.boundingBox).applyMatrix4(b2.body.matrixWorld);

                    if (!b1.isJumping && !b2.isJumping && b1Box.intersectsBox(b2Box)) {
                        b1.destroy();
                        b2.destroy();
                        checkMatchStatus();
                        break;
                    }
                }
            }
        }

        function checkMatchStatus() {
            const livingBikes = bikes.filter(b => b.alive);

            if (!player.alive && gameActive && !isSpectating) {
                document.getElementById('gameover-text').innerText = "YOU CRASHED!";
                document.getElementById('watch-btn').style.display = 'block';
                document.getElementById('gameover').style.display = 'block';
                return;
            }

            if (livingBikes.length <= 1) {
                gameActive = false;
                document.getElementById('spectate-hud').style.display = 'none';
                let message = "IT'S A DRAW!";
                if (livingBikes.length === 1) {
                    const winner = livingBikes[0];
                    message = winner.isAI ? `${winner.name} (${winner.personality.toUpperCase()}) WINS!` : "YOU WIN!";
                }
                document.getElementById('gameover-text').innerText = message;
                document.getElementById('watch-btn').style.display = 'none';
                document.getElementById('gameover').style.display = 'block';
            }
        }

        function drawMinimap() {
            if (!minimapCtx) return;
            const w = 150;
            const h = 150;
            minimapCtx.clearRect(0, 0, w, h);

            const scale = w / MAP_SIZE;
            const offsetX = MAP_SIZE / 2;
            const offsetZ = MAP_SIZE / 2;

            const toCanvasCoords = (x, z) => ({
                x: (x + offsetX) * scale,
                y: (z + offsetZ) * scale
            });

            const now = Date.now();
            for (let item of dynamicBoxes) {
                if (now - item.createdTime < 800) {
                    minimapCtx.fillStyle = '#ffffff';
                } else {
                    minimapCtx.fillStyle = item.solidColor;
                }
                const pt = toCanvasCoords(item.box.min.x, item.box.min.z);
                minimapCtx.fillRect(pt.x - 1, pt.y - 1, 2, 2);
            }

            if (soccerBall) {
                const bPos = toCanvasCoords(soccerBall.mesh.position.x, soccerBall.mesh.position.z);
                minimapCtx.fillStyle = '#ff3300';
                minimapCtx.beginPath();
                minimapCtx.arc(bPos.x, bPos.y, 2.5, 0, Math.PI * 2);
                minimapCtx.fill();
            }

            bikes.forEach(b => {
                if (!b.alive) return;
                const pos = toCanvasCoords(b.mesh.position.x, b.mesh.position.z);
                minimapCtx.fillStyle = '#' + b.color.toString(16).padStart(6, '0');
                minimapCtx.beginPath();
                minimapCtx.arc(pos.x, pos.y, b.isAI ? 2.5 : 3.5, 0, Math.PI * 2);
                minimapCtx.fill();
            });
        }

        window.restartGame = function() {
            gameActive = true;
            isSpectating = false;
            document.getElementById('gameover').style.display = 'none';
            document.getElementById('jump-overlay').style.display = 'none';
            document.getElementById('nos-overlay').style.display = 'none';
            document.getElementById('spectate-hud').style.display = 'none';
            resetPositions();
        }

        window.spectateGame = function() {
            isSpectating = true;
            document.getElementById('gameover').style.display = 'none';
            document.getElementById('spectate-hud').style.display = 'flex';
            
            // Find first available living bike to spectate
            const living = bikes.filter(b => b.alive);
            if (living.length > 0) {
                specTargetIndex = bikes.indexOf(living[0]);
            }
        }

        window.switchCameraTarget = function() {
            const living = bikes.filter(b => b.alive);
            if (living.length === 0) return;

            let currentIndex = living.findIndex(b => bikes.indexOf(b) === specTargetIndex);
            currentIndex = (currentIndex + 1) % living.length;
            specTargetIndex = bikes.indexOf(living[currentIndex]);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (gameActive) {
                player.update();
                bikes.forEach(b => {
                    if (b.isAI) {
                        updateAI(b);
                        b.update();
                    }
                });
                soccerBall.update();
                checkCollisions();

                let targetCamBike = player;
                if (!player.alive && isSpectating) {
                    const target = bikes[specTargetIndex];
                    if (target && target.alive) {
                        targetCamBike = target;
                    } else {
                        // Automatically find next alive bike if current target crashed
                        const living = bikes.filter(b => b.alive);
                        if (living.length > 0) {
                            specTargetIndex = bikes.indexOf(living[0]);
                            targetCamBike = living[0];
                        }
                    }
                }

                if (targetCamBike && (targetCamBike.alive || (!player.alive && isSpectating))) {
                    const camOffset = new THREE.Vector3(
                        -Math.sin(targetCamBike.angle) * 1.5,
                        1.8 + (targetCamBike.isJumping ? Math.sin(targetCamBike.jumpProgress * Math.PI) * 4 : 0),
                        -Math.cos(targetCamBike.angle) * 1.5
                    );
                    camera.position.copy(targetCamBike.mesh.position).add(camOffset);
                    
                    const lookTarget = targetCamBike.mesh.position.clone().add(new THREE.Vector3(
                        Math.sin(targetCamBike.angle) * 10,
                        1.2,
                        Math.cos(targetCamBike.angle) * 10
                    ));
                    camera.lookAt(lookTarget);
                }
            }

            renderer.render(scene, camera);
            drawMinimap();
        }

        init();
    </script>
</body>
</html>
